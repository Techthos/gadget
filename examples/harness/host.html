<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gomukit · harness</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #fafafb;
    --line: #e4e6eb;
    --line-soft: #eceef2;
    --text: #14161a;
    --muted: #6a7280;
    --accent: #7c3aed;
    --accent-soft: #f1ebfe;
    --in: #0d9488;
    --out: #7c3aed;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16, 18, 24, .05), 0 8px 24px rgba(16, 18, 24, .06);
    --dot: rgba(20, 22, 26, .09);
    --radius: 10px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1014;
    --panel: #16181d;
    --panel-2: #1b1e24;
    --line: #272b33;
    --line-soft: #21242b;
    --text: #e8eaef;
    --muted: #949cab;
    --accent: #a78bfa;
    --accent-soft: #241f38;
    --in: #2dd4bf;
    --out: #a78bfa;
    --danger: #f87171;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
    --dot: rgba(255, 255, 255, .07);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  code, pre, textarea, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* --- top bar --- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .625rem 1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: .5rem; }
  .mark {
    width: 26px; height: 26px; display: grid; place-items: center;
    border-radius: 8px; color: #fff;
    background: linear-gradient(135deg, var(--accent), #4f46e5);
  }
  .mark svg { width: 15px; height: 15px; }
  .brand-name { font-weight: 650; letter-spacing: -.01em; }
  .chip {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: .1rem .45rem;
  }
  .by {
    color: var(--muted); text-decoration: none; font-size: 12px;
    border-left: 1px solid var(--line); padding-left: .6rem; margin-left: .15rem;
  }
  .by strong { font-weight: 600; color: var(--text); }
  .by:hover { color: var(--text); }
  .by:hover strong { color: var(--accent); }
  .topbar-actions { display: flex; align-items: center; gap: .5rem; }

  .btn {
    font: inherit; line-height: 1.2;
    padding: .4rem .7rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); cursor: pointer;
    transition: background .12s, border-color .12s, transform .04s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--muted); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.tiny { font-size: 12px; padding: .2rem .45rem; }

  .icon-link {
    display: inline-grid; place-items: center;
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); text-decoration: none;
    transition: background .12s, border-color .12s, transform .04s;
  }
  .icon-link:hover { background: var(--panel-2); border-color: var(--muted); }
  .icon-link:active { transform: translateY(1px); }
  .icon-link svg { width: 18px; height: 18px; }
  .btn:focus-visible, .seg button:focus-visible, .story:focus-visible,
  textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button {
    font: inherit; font-size: 12px; padding: .25rem .55rem;
    border: 0; background: transparent; color: var(--muted);
    border-radius: 6px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

  /* --- layout --- */
  .layout {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 15rem minmax(0, 1fr) 24rem;
  }
  .layout > * { min-height: 0; }

  /* --- story rail --- */
  .rail {
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow: auto;
    padding: .75rem .625rem 2rem;
  }
  .rail-group {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); padding: .9rem .5rem .3rem;
  }
  .story {
    display: block; width: 100%; text-align: left;
    font: inherit; cursor: pointer;
    border: 0; background: transparent; color: var(--text);
    border-radius: 8px; padding: .4rem .5rem;
  }
  .story:hover { background: var(--panel-2); }
  .story[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* --- stage --- */
  .stage { min-width: 0; display: flex; flex-direction: column; }
  .stage-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    padding: .9rem 1.25rem .75rem;
    border-bottom: 1px solid var(--line-soft);
  }
  .stage-head h1 { font-size: 15px; }
  .stage-head p { margin: .15rem 0 0; color: var(--muted); font-size: 13px; }
  .src { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .canvas {
    flex: 1; min-height: 0; overflow: auto;
    padding: 1.5rem;
    background:
      radial-gradient(var(--dot) 1px, transparent 1px) 0 0 / 18px 18px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .frame {
    width: 100%; max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: max-width .18s ease;
  }
  /* The iframe is left unpainted and unbordered — the UA default border and any
   * background here would draw the frame the widget is trying not to show. */
  iframe { display: block; width: 100%; height: 480px; border: 0; background: transparent; }

  /* --- side panel --- */
  .panel {
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column; gap: .75rem;
    padding: .875rem; min-height: 0; overflow: hidden;
  }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel-2); padding: .7rem;
    display: flex; flex-direction: column; gap: .5rem;
  }
  .card.grow { flex: 1; min-height: 8rem; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .hint { margin: -.25rem 0 0; font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .check { display: flex; align-items: center; gap: .45rem; font-size: 13px; color: var(--text); cursor: pointer; }
  .check.tiny { font-size: 12px; color: var(--muted); }
  .err { margin: 0; font-size: 12px; color: var(--danger); }

  textarea {
    font-size: 12px; line-height: 1.45;
    width: 100%; height: 8.5rem; resize: vertical;
    padding: .5rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }

  /* --- traffic log --- */
  .log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; font-size: 12px; }
  .entry {
    display: grid; grid-template-columns: 1rem minmax(0, 1fr); gap: .4rem;
    padding: .25rem .1rem; border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
  }
  .entry:hover { background: var(--panel); }
  .entry .dir { font-weight: 700; }
  .entry.out .dir { color: var(--out); }
  .entry.in .dir { color: var(--in); }
  .entry .head { min-width: 0; }
  .entry .method {
    display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry .preview {
    display: block; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .entry pre {
    grid-column: 2; margin: .3rem 0 .1rem; padding: .45rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    white-space: pre-wrap; word-break: break-word; max-height: 16rem; overflow: auto;
  }
  .entry:not(.open) pre { display: none; }
  .entry.noise { display: none; }
  .log.show-noise .entry.noise { display: grid; }
  .log-empty { color: var(--muted); padding: .4rem .1rem; }

  @media (max-width: 1200px) {
    .layout { grid-template-columns: 13rem minmax(0, 1fr) 20rem; }
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; grid-auto-rows: min-content; }
    .rail, .panel { border: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .panel { max-height: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9.5h18M9 9.5V20"/>
      </svg>
    </span>
    <span class="brand-name">gomukit</span>
    <span class="chip">harness</span>
    <a class="by" href="https://www.techthos.net/" target="_blank" rel="noopener noreferrer"
       title="Agentic Software Development, done the right way.">by <strong>Techthos</strong></a>
  </div>
  <div class="topbar-actions">
    <div class="seg" id="viewport" role="group" aria-label="Viewport width">
      <button data-w="full" aria-pressed="true">Full</button>
      <button data-w="900" aria-pressed="false">900</button>
      <button data-w="600" aria-pressed="false">600</button>
      <button data-w="380" aria-pressed="false">380</button>
    </div>
    <button class="btn" id="frameless" aria-pressed="true">Frameless</button>
    <button class="btn" id="theme" aria-pressed="false">Dark theme</button>
    <button class="btn" id="reload">Reload</button>
    <a class="icon-link" href="https://github.com/techthos/gomukit"
       target="_blank" rel="noopener noreferrer"
       title="gomukit on GitHub" aria-label="gomukit on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </div>
</header>

<div class="layout">
  <nav class="rail" id="rail" aria-label="Stories"></nav>

  <main class="stage">
    <div class="stage-head">
      <div>
        <h1 id="story-title">Loading…</h1>
        <p id="story-desc"></p>
      </div>
      <code class="src" id="story-src"></code>
    </div>
    <div class="canvas">
      <div class="frame" id="frame-wrap">
        <iframe id="frame" title="widget under test" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </main>

  <aside class="panel">
    <section class="card">
      <h2>Push tool result</h2>
      <p class="hint">structuredContent for ui/notifications/tool-result</p>
      <textarea id="payload" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn primary" id="push">Push result</button>
        <button class="btn" id="toolinput">tool-input</button>
        <button class="btn" id="cancel">tool-cancelled</button>
      </div>
      <p class="err" id="payload-err" hidden></p>
    </section>

    <section class="card">
      <h2>Host behaviour</h2>
      <label class="check"><input type="checkbox" id="failsave"> save_user answers with a field error</label>
      <label class="check"><input type="checkbox" id="autoheight" checked> Follow size-changed (auto height)</label>
    </section>

    <section class="card grow">
      <div class="card-head">
        <h2>Traffic</h2>
        <div class="row">
          <label class="check tiny"><input type="checkbox" id="shownoise"> size events</label>
          <button class="btn tiny" id="clear">Clear</button>
        </div>
      </div>
      <div class="log" id="log"></div>
    </section>
  </aside>
</div>

<script>
  const frame = document.getElementById("frame");
  const frameWrap = document.getElementById("frame-wrap");
  const logEl = document.getElementById("log");
  const payloadEl = document.getElementById("payload");
  const payloadErr = document.getElementById("payload-err");
  const root = document.documentElement;

  let dark = matchMedia("(prefers-color-scheme: dark)").matches;
  // Default on: the widget document paints no page fill and no gutter, so the
  // iframe is invisible and only the widget's card sits on this page. Toggle it
  // off to see the framed default (?transparent=0 on the story route).
  let frameless = true;
  let current = null;

  // A tiny stateful "database" so row/bulk actions visibly update the widget.
  // Reset whenever a story is (re)loaded. It always holds the four seed users,
  // so acting on a story with synthesized rows collapses the list to the seed.
  const seed = () => [
    { id: 1, name: "Ada Lovelace", email: "ada@example.com", balance: 1200.5, createdAt: "2026-01-12T09:00:00Z", status: "active", website: "https://example.com/ada" },
    { id: 2, name: "Grace Hopper", email: "grace@example.com", balance: 815, createdAt: "2026-02-03T10:30:00Z", status: "active", website: "https://example.com/grace" },
    { id: 3, name: "Alan Turing", email: "alan@example.com", balance: 0, createdAt: "2026-03-19T14:00:00Z", status: "invited", website: "" },
    { id: 4, name: "Katherine Johnson", email: "katherine@example.com", balance: 233.1, createdAt: "2026-04-01T08:15:00Z", status: "active", website: "https://example.com/katherine" },
  ];
  let users = seed();

  // --- theme ---

  const applyTheme = () => {
    root.dataset.theme = dark ? "dark" : "light";
    const btn = document.getElementById("theme");
    btn.textContent = dark ? "Light theme" : "Dark theme";
    btn.setAttribute("aria-pressed", String(dark));
  };

  const hostContext = () => ({
    theme: dark ? "dark" : "light",
    displayMode: "inline",
    locale: "en-US",
    timeZone: "UTC",
    platform: "web",
    styles: { variables: dark
      ? { "--color-background-primary": "#16181d", "--color-background-secondary": "#1b1e24",
          "--color-text-primary": "#e8eaef", "--color-text-secondary": "#949cab",
          "--color-border-primary": "#272b33" }
      : { "--color-background-primary": "#ffffff", "--color-background-secondary": "#fafafb",
          "--color-text-primary": "#14161a", "--color-text-secondary": "#6a7280",
          "--color-border-primary": "#e4e6eb" } },
  });

  // --- traffic log ---

  const log = (dir, msg) => {
    const method = msg.method ?? (msg.error ? "error" : "result");
    const entry = document.createElement("div");
    entry.className = "entry " + (dir === "out" ? "out" : "in");
    if (method === "ui/notifications/size-changed") entry.classList.add("noise");

    const arrow = document.createElement("span");
    arrow.className = "dir";
    arrow.textContent = dir === "out" ? "→" : "←";

    const head = document.createElement("span");
    head.className = "head";
    const name = document.createElement("span");
    name.className = "method";
    name.textContent = method;
    const preview = document.createElement("span");
    preview.className = "preview";
    preview.textContent = JSON.stringify(msg.params ?? msg.result ?? msg.error ?? {});
    head.append(name, preview);

    const full = document.createElement("pre");
    full.textContent = JSON.stringify(msg, null, 2);

    entry.append(arrow, head, full);
    entry.onclick = () => entry.classList.toggle("open");

    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 24;
    logEl.append(entry);
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;
  };

  const clearLog = () => {
    logEl.textContent = "";
    const empty = document.createElement("div");
    empty.className = "log-empty";
    empty.textContent = "No traffic yet.";
    logEl.append(empty);
  };
  const dropEmpty = () => logEl.querySelector(".log-empty")?.remove();

  // --- transport ---

  const send = (msg) => {
    const full = { jsonrpc: "2.0", ...msg };
    dropEmpty();
    log("out", full);
    frame.contentWindow.postMessage(full, "*");
  };
  const notify = (method, params) => send({ method, params });

  window.addEventListener("message", (ev) => {
    const msg = ev.data;
    if (!msg || msg.jsonrpc !== "2.0" || ev.source !== frame.contentWindow) return;
    dropEmpty();
    log("in", msg);

    if (msg.method === "ui/initialize") {
      send({ id: msg.id, result: { protocolVersion: "2026-01-26", hostContext: hostContext() } });
    } else if (msg.method === "ui/notifications/size-changed") {
      if (document.getElementById("autoheight").checked && msg.params?.height) {
        frame.style.height = Math.min(Math.max(msg.params.height, 200), 1400) + "px";
      }
    } else if (msg.method === "tools/call") {
      const { name, arguments: args } = msg.params;
      let result;
      if (name === "save_user" && document.getElementById("failsave").checked) {
        result = { structuredContent: { errors: { email: "This email is already taken." } } };
      } else if (name === "delete_user") {
        users = users.filter((u) => u.id !== args.id);
        result = { content: [{ type: "text", text: `Deleted #${args.id}.` }],
                   structuredContent: { rows: users } };
      } else if (name === "archive_users") {
        const ids = new Set(args.ids ?? []);
        users = users.map((u) => (ids.has(u.id) ? { ...u, status: "archived" } : u));
        result = { content: [{ type: "text", text: `Archived ${ids.size} user(s).` }],
                   structuredContent: { rows: users } };
      } else {
        result = { content: [{ type: "text", text: `${name} ok.` }], structuredContent: {} };
      }
      setTimeout(() => send({ id: msg.id, result }), 400); // visible loading state
    } else if (msg.method === "ui/message") {
      // A prompt tile navigates through the chat: a real host posts this as a
      // user turn and the model's answer opens the widget. There is no chat
      // here, so acking is the whole of it — the traffic pane is the proof.
      send({ id: msg.id, result: {} });
    } else if (msg.id !== undefined && msg.method) {
      send({ id: msg.id, result: {} }); // any other request: ack
    }
  });

  // --- story rail ---

  let byId = new Map();

  const loadStory = (story, { keepLog = false } = {}) => {
    current = story;
    byId.forEach((_, id) => {
      const btn = document.querySelector(`.story[data-id="${id}"]`);
      if (btn) btn.setAttribute("aria-current", String(id === story.id));
    });
    document.getElementById("story-title").textContent = `${story.group} · ${story.label}`;
    document.getElementById("story-desc").textContent = story.desc;
    const src = frameless ? story.src : story.src + "?transparent=0";
    document.getElementById("story-src").textContent = src;
    payloadEl.value = story.payload;
    payloadErr.hidden = true;
    users = seed();
    frame.style.height = "480px";
    if (!keepLog) clearLog();
    frame.src = src;
    if (location.hash.slice(1) !== story.id) history.replaceState(null, "", "#" + story.id);
  };

  const renderRail = (list) => {
    const rail = document.getElementById("rail");
    rail.textContent = "";
    let group = null;
    for (const s of list) {
      if (s.group !== group) {
        group = s.group;
        const h = document.createElement("div");
        h.className = "rail-group";
        h.textContent = group;
        rail.append(h);
      }
      const btn = document.createElement("button");
      btn.className = "story";
      btn.dataset.id = s.id;
      btn.textContent = s.label;
      btn.title = s.desc;
      btn.onclick = () => loadStory(s);
      rail.append(btn);
    }
  };

  // --- controls ---

  document.getElementById("viewport").onclick = (ev) => {
    const btn = ev.target.closest("button[data-w]");
    if (!btn) return;
    for (const b of ev.currentTarget.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b === btn));
    }
    frameWrap.style.maxWidth = btn.dataset.w === "full" ? "" : btn.dataset.w + "px";
  };
  document.getElementById("reload").onclick = () => { if (current) loadStory(current); };
  document.getElementById("frameless").onclick = (ev) => {
    frameless = !frameless;
    ev.currentTarget.setAttribute("aria-pressed", String(frameless));
    if (current) loadStory(current);
  };
  document.getElementById("theme").onclick = () => {
    dark = !dark;
    applyTheme();
    notify("ui/notifications/host-context-changed", hostContext());
  };
  document.getElementById("push").onclick = () => {
    try {
      const structuredContent = JSON.parse(payloadEl.value);
      payloadErr.hidden = true;
      // Mirror what a real server sends: with no content of its own, the
      // structured output is echoed into a text block (the spec suggests it
      // and the Go SDK does it), which is exactly the payload the status bar
      // must never show.
      notify("ui/notifications/tool-result", {
        structuredContent,
        content: [{ type: "text", text: JSON.stringify(structuredContent) }],
      });
    } catch (e) {
      payloadErr.textContent = String(e);
      payloadErr.hidden = false;
    }
  };
  document.getElementById("toolinput").onclick = () =>
    notify("ui/notifications/tool-input", { arguments: {} });
  document.getElementById("cancel").onclick = () =>
    notify("ui/notifications/tool-cancelled", {});
  document.getElementById("clear").onclick = clearLog;
  document.getElementById("shownoise").onchange = (ev) =>
    logEl.classList.toggle("show-noise", ev.target.checked);

  // --- boot ---

  window.addEventListener("hashchange", () => {
    const s = byId.get(location.hash.slice(1));
    if (s && s !== current) loadStory(s);
  });

  applyTheme();
  clearLog();
  fetch("/stories.json")
    .then((r) => r.json())
    .then((list) => {
      byId = new Map(list.map((s) => [s.id, s]));
      renderRail(list);
      loadStory(byId.get(location.hash.slice(1)) ?? list[0]);
    });
</script>
</body>
</html>
